# -- H2 (in-memory) configuration (default for dev/demo)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# -- Uncomment below and adjust values to use MySQL instead
#spring.datasource.url=jdbc:mysql://localhost:3306/musicdb?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=your_password_here
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

ai.service.base-url=http://localhost:8000
ai.service.timeout-seconds=3
ai.service.fallback-popular-size=10

app.dataset.csv-path=${MUSIC_DATASET_PATH:../data/dataset.csv}
app.dataset.max-load=0
app.dataset.batch-size=1000
